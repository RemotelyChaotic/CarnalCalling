<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:svg="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64"
     version="1.1" id="switching-stance-icon">
  <title>Switching Stance — Changeling Card Icon</title>
  <defs>
    <clipPath id="chitin-shape">
      <path d="M32 2.8 54.8 14.2 61.2 32 54.8 49.8 32 61.2 9.2 49.8 2.8 32 9.2 14.2Z"/>
    </clipPath>
  </defs>

  <!-- Angular chitin silhouette: distinct from the oval and heart icons -->
  <path d="M32 2.8 54.8 14.2 61.2 32 54.8 49.8 32 61.2 9.2 49.8 2.8 32 9.2 14.2Z"
        fill="#303b19" stroke="#d9ed45" stroke-width="1.15"
        stroke-linejoin="round"/>

  <!-- Faceted shell -->
  <g clip-path="url(#chitin-shape)">
    <path d="M32 2.8 32 20 9.2 14.2Z" fill="#b7d936"/>
    <path d="M32 2.8 54.8 14.2 32 20Z" fill="#e5ed58"/>
    <path d="M9.2 14.2 32 20 19.5 32 2.8 32Z" fill="#829b25"/>
    <path d="M54.8 14.2 61.2 32 44.5 32 32 20Z" fill="#d6e94b"/>
    <path d="M2.8 32 19.5 32 32 44 9.2 49.8Z" fill="#a9c92d"/>
    <path d="M61.2 32 54.8 49.8 32 44 44.5 32Z" fill="#c4dc38"/>
    <path d="M9.2 49.8 32 44 32 61.2Z" fill="#eff06a"/>
    <path d="M32 44 54.8 49.8 32 61.2Z" fill="#35421c"/>
    <path d="M32 20 44.5 32 32 44 19.5 32Z" fill="#35451b"/>
    <path d="M32 20 44.5 32 32 32Z" fill="#718d25"/>
    <path d="M19.5 32 32 32 32 44Z" fill="#b7d83b"/>
  </g>

  <!-- Facet seams -->
  <g fill="none" stroke="#303b19" stroke-width=".55" opacity=".78"
     stroke-linejoin="round">
    <path d="M32 3 32 20 19.5 32 9.2 14.2"/>
    <path d="M32 20 44.5 32 54.8 14.2"/>
    <path d="M19.5 32 32 44 9.2 49.8"/>
    <path d="M44.5 32 32 44 54.8 49.8"/>
    <path d="M32 44 32 61"/>
  </g>

  <!-- Two opposing stance-switch arrows -->
  <g stroke="#29351a" stroke-width="5.1" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M18.5 27.5 C19.8 21.8 25.1 18.5 31.2 19.4"/>
    <path d="M45.5 36.5 C44.2 42.2 38.9 45.5 32.8 44.6"/>
  </g>
  <g stroke="#f2f58a" stroke-width="2.5" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M18.5 27.5 C19.8 21.8 25.1 18.5 31.2 19.4"/>
    <path d="M45.5 36.5 C44.2 42.2 38.9 45.5 32.8 44.6"/>
  </g>
  <g fill="#f2f58a" stroke="#29351a" stroke-width="1.1"
     stroke-linejoin="round">
    <path d="m25.8 15.7 7.3 4.2-7.8 3.1Z"/>
    <path d="m38.2 48.3-7.3-4.2 7.8-3.1Z"/>
  </g>

  <!-- Small central split, suggesting the two available stances -->
  <path d="M32 25.5 27.8 32 32 38.5 36.2 32Z"
        fill="#303b19" stroke="#d9ed45" stroke-width=".8"
        stroke-linejoin="round"/>
  <path d="M32 26.8 32 37.2 28.8 32Z" fill="#b7d936"/>
  <path d="M32 26.8 35.2 32 32 37.2Z" fill="#e5ed58"/>

  <!-- Outer chitin highlight -->
  <path d="M32 2.8 54.8 14.2 61.2 32 54.8 49.8 32 61.2 9.2 49.8 2.8 32 9.2 14.2Z"
        fill="none" stroke="#d9ed45" stroke-width=".55"
        stroke-linejoin="round" opacity=".9"/>
</svg>
